name: Prebuild devcontainer image

# Builds the devcontainer (base image + Features + onCreateCommand) once on
# GitHub's runners and pushes the fully-baked image to GHCR. Starting a
# container from this image is then just pull + run — no local Feature builds,
# no flaky release-asset downloads on your machine.

on:
  push:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer-prebuild.yml"
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image name must be lowercase for GHCR.
      - name: Compute image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/iac-devcontainer" >> "$GITHUB_OUTPUT"

      - name: Build and push prebuilt devcontainer
        uses: devcontainers/ci@v0.3
        with:
          imageName: ${{ steps.img.outputs.name }}
          imageTag: latest
          cacheFrom: ${{ steps.img.outputs.name }}:latest
          push: always
